embed_base_url: http://127.0.0.1:1234/v1
# API key: set via FACTKIT_EMBED_API_KEY or agent secret scope (secret)
embed_api_key: ""
embed_model: text-embedding-nomic-embed-text-v1.5
prefetch: true
limit: 3
min_score: 0.55
# Embedding-mode re-rank of fused hits. Off by default: costs an embedding
# round trip on every turn.
rerank: false
# Minimum gain a re-rank must show; below this the original order is kept.
rerank_min_gain: 0.01
